name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` : le scan de secrets de `tests/test_secrets.py` lit
      # `git log --all -p`. Avec le clone superficiel par defaut, il n'aurait qu'un
      # commit a scanner et se retirerait — vert, sans avoir rien verifie. Le depot
      # pese 13 Mo, l'historique complet ne coute rien.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version exacte : `setup-uv` ne publie pas de tag majeur flottant au-dela
      # de v7, `@v9` ne se resout pas.
      - name: Installer uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # `--frozen` : la CI echoue si `uv.lock` ne correspond plus a `pyproject.toml`,
      # au lieu de resoudre en silence une pile differente de celle du poste.
      - name: Synchroniser l'environnement
        run: uv sync --frozen

      - name: Verifier l'interpreteur epingle
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Lint
        run: uv run ruff check

      - name: Tests
        run: uv run pytest

      # Le raccourci Microsoft Store de la machine cible casse toute invocation de
      # l'interpreteur suffixe. Deux precautions de redaction :
      #   - le motif s'ecrit avec une classe de caracteres, sinon cette etape se
      #     detecterait elle-meme ;
      #   - `CLAUDE.md` est exclu : c'est le fichier qui ENONCE l'interdiction, il
      #     doit pouvoir la citer telle quelle pour rester lisible.
      # Deux exclusions supplementaires depuis l'issue #9, et seulement deux : les
      # notebooks portent un KERNELSPEC Jupyter nomme `python[3]`, plus un lexer
      # `ipython[3]`. Ce sont des identifiants de noyau, pas des invocations d'un
      # executable — le raccourci Microsoft Store ne peut pas les casser. Les filtrer
      # par nom exact plutot que d'exclure `*.ipynb` en bloc garde la garde active
      # sur le CODE des cellules, ou un `!python[3] ...` serait un vrai probleme.
      # Les motifs de filtrage s'ecrivent eux aussi avec une classe de caracteres,
      # sinon cette etape se detecterait elle-meme.
      - name: Aucune invocation de l'interpreteur suffixe
        run: |
          if git ls-files -z ':!CLAUDE.md' | xargs -0 grep -nI "python[3]" \
              | grep -v '"name": "python[3]"' \
              | grep -v '"pygments_lexer": "ipython[3]"'; then
            echo "::error::reference interdite a l'interpreteur suffixe (voir CLAUDE.md)"
            exit 1
          fi
