# Theme du dashboard.
#
# Les couleurs viennent du systeme de dataviz du projet et ont ete passees au
# validateur : bande de clarte, plancher de chroma, separation pour les daltonismes
# et contraste sur la surface. Elles ne sont pas choisies a l'oeil.
#
# Sans ce fichier, Streamlit peint le curseur et les accents en rouge, qui est une
# couleur de STATUT dans ce systeme : la reserver aux etats critiques evite qu'un
# accent d'interface soit lu comme une alerte.

[theme]
base = "light"
primaryColor = "#2a78d6"       # bleu, slot categoriel 1
backgroundColor = "#fcfcfb"    # surface claire
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"          # encre primaire

# ─── Typographie ──────────────────────────────────────────────────────────────
#
# Fraunces pour les titres, Inter pour le texte. Le contraste entre une serif a
# caractere et une sans neutre est ce qui fait lire « quelqu'un a choisi ca » ; par
# defaut Streamlit compose tout en Source Sans, ce qui ne dit rien.
#
# Les fichiers sont AUTO-HEBERGES, jamais appeles sur un CDN : la demo doit tourner
# sans reseau, et une police distante retomberait sur une fonte systeme exactement
# le jour ou on la montre a un client. C'est aussi pourquoi `enableStaticServing`
# est active plus bas — sans lui, `app/static/` ne repond pas.
#
# Les plages Unicode sont celles de Google Fonts, reprises telles quelles : le
# navigateur ne telecharge le sous-ensemble etendu que si un glyphe l'exige. Le
# garder protege un futur nom de spot sans rien couter a l'execution.
font = "Inter, sans-serif"
headingFont = "Fraunces, serif"

# Echelle posee, pas celle par defaut. h1 porte le nom du produit et veut de la
# presence ; h2 separe les sections sans concurrencer le titre.
headingFontSizes = ["3rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]

# Angles adoucis : le brief est « c'est beau, j'ai envie de jouer », pas « c'est un
# terminal ». Reste discret pour ne pas tomber dans le bubbly uniforme.
baseRadius = "0.5rem"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-latin-ext.woff2"
weight = "100 900"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-latin.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/Fraunces-latin-ext.woff2"
weight = "100 900"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/Fraunces-latin.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[server]
headless = true
# Sert `src/nalu/static/` sous `app/static/`. Requis par les polices ci-dessus.
enableStaticServing = true

[browser]
gatherUsageStats = false
