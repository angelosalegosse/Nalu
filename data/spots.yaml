# Référentiel des spots — CURÉ À LA MAIN.
#
# ─── Provenance ───────────────────────────────────────────────────────────────
#
# `source` porte, pour chaque spot, la page d'où viennent le secteur de vent
# offshore, le type de fond et le régime de houle. La source primaire est le guide
# de spot de surf-forecast.com, retenu parce qu'il couvre les 20 spots avec la même
# grille de lecture — ce qui rend les valeurs comparables entre elles.
#
# `confidence` dit ce qu'on sait vraiment :
#   high    le seuil est documenté finement pour ce spot précis ;
#   medium  le secteur de vent et le fond sont sourcés, les seuils de hauteur et de
#           période sont une lecture experte de ce que la source décrit ;
#   low     la source elle-même décrit un spot irrégulier, les seuils sont indicatifs.
#
# ─── Coordonnées ──────────────────────────────────────────────────────────────
#
# Elles visent le pic, donc légèrement au large du trait de côte. Natural Earth 10m
# dessine la côte au large du pic sur 12 des 20 spots : la coordonnée a alors été
# ressortie perpendiculairement au trait, du plus court chemin, plus 800 m de marge.
# Déplacement maximal appliqué : 1,9 km (Supertubos). Toutes restent à moins de 2 km
# du spot réel.
#
# ─── Contrôle croisé des fenêtres calculées ───────────────────────────────────
#
# La fenêtre obtenue par lancer de rayons a été comparée à la direction de houle
# idéale annoncée par la source, à la tolérance d'un secteur de boussole près.
# **15 spots sur 20 concordent sans intervention.** Les 5 écarts ont deux causes,
# toutes deux systématiques et toutes deux documentées spot par spot ci-dessous :
#
#   1. POINT BREAKS À ENROULEMENT (anchor-point, jeffreys-bay, chicama).
#      La houle qui fait marcher un point break arrive du large sur un cap que le
#      cap lui-même masque, puis réfracte autour de la pointe. Le lancer de rayons
#      mesure l'exposition LOCALE ; ERA5 à 50 km donne une direction proche de celle
#      du large. Les deux ne coïncident pas, et c'est le principe même d'un point.
#
#   2. OMBRE D'UNE ÎLE SOUS 500 KM (tres-palmas, tamarin-bay).
#      Le seuil `open_ocean_km` mesure la longueur de fetch nécessaire à la formation
#      d'une houle longue. L'utiliser comme critère de blocage fait déclarer fermé un
#      secteur où une île se trouve à moins de 500 km, alors que la houle y passe.
#
# Ces 5 spots portent un `swell_dir_override`, chacun avec sa raison. La fenêtre y
# est le secteur de 90 degrés centré sur la direction annoncée par la source.
#
# ─── Ce qui reste à valider ───────────────────────────────────────────────────
#
# 1. `hs_offshore_min` / `hs_offshore_max` sont des hauteurs significatives AU LARGE
#    (ERA5, maille 50 km), pas des tailles de vague au pic. Aucune source publique ne
#    les publie sous cette forme : elles sont déduites du seuil de fonctionnement
#    décrit par la source. C'est l'hypothèse la plus fragile du référentiel, et c'est
#    précisément ce que la validation externe de l'issue #9 doit mesurer.
# 2. `wind_speed_max_offshore` / `_onshore` sont un DÉFAUT DE PROJET, pas une valeur
#    par spot : 14 et 7 m/s partout, 16 et 8 à Klitmøller dont la houle est justement
#    engendrée par le vent. Aucune source ne publie de tolérance au vent par spot.
#    Le rapport de 2 entre les deux est la règle métier, elle est dans l'issue #1.
# 3. `wind_dir_offshore_min` / `_max` sont un secteur de 90 degrés centré sur la
#    direction offshore annoncée par la source, faute de secteur publié.
#
# ─── Ce qui n'est PAS dans ce fichier ─────────────────────────────────────────
#
# `swell_dir_min` / `swell_dir_max` sont CALCULÉS et vivent dans
# data/exposure_windows.yaml, régénéré par `uv run python -m nalu.exposure`.

