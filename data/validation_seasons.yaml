# Référentiel de VALIDATION EXTERNE — issue #9.
#
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Ce fichier est une RÉFÉRENCE, pas un paramètre. Rien ici n'entre dans le      │
# │ modèle. Il sert uniquement à confronter, après coup, le pic mensuel CALCULÉ   │
# │ par Nalu à ce que le monde du surf publie de son côté.                        │
# │                                                                              │
# │ Il est écrit AVANT toute mesure d'accord et AVANT tout ajustement de seuil.   │
# │ C'est la seule chose qui sépare une validation d'un ajustement déguisé :      │
# │ remplir ce fichier après avoir vu les résultats reviendrait à recopier la     │
# │ réponse. Son historique git en fait foi.                                      │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# DEUX sources indépendantes, comme l'impose la révision d'ingénierie du
# 2 août 2026. « La saison réputée » n'est pas une source : ce serait l'auteur
# jugeant son propre modèle.
#
#   (a) `wsl_ct_mois` — mois des épreuves du Championship Tour WSL sur les spots
#       qui en accueillent, actuelles ou historiques. C'est la source la plus dure :
#       la WSL engage de l'argent sur une fenêtre, elle ne se trompe pas de saison.
#       Source unique : https://www.worldsurfleague.com/events/2026/ct
#       Réserve : une épreuve a une PÉRIODE D'ATTENTE de 10 à 14 jours et peut
#       déborder sur le mois voisin. Les mois listés couvrent cette fenêtre.
#
#   (b) `saison_publiee` — haute saison publiée par les guides de surf et les
#       périodes d'ouverture des surf camps, sur les 20 spots. Chaque entrée porte
#       son URL, et chacune a été vérifiée accessible le 2026-08-03.
#
# `saison_publiee` est la HAUTE saison, pas la plage surfable. Une fenêtre large
# rendrait l'accord trivial à obtenir et la validation sans valeur.
#
# Mois en base 1 : 1 = janvier.

