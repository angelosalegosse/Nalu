[project]
name = "nalu"
version = "0.1.0"
description = "Moteur de recommandation de trips surf : climatologie de houle x prix des vols"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "polars>=1.17",
    "pyarrow>=18.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "retry-requests>=2.0",
    "httpx>=0.28",
    "truststore>=0.10",
    "shapely>=2.0",
    "streamlit>=1.41",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.122",
    "pytest-socket>=0.7",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nalu"]

[tool.uv]
# Epingle l'interpreteur : le `python` de la machine cible est en 3.14, dont la
# pile scientifique n'est pas stabilisee. uv telecharge 3.12 s'il est absent.
python-preference = "managed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
